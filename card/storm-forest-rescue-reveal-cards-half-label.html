<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暴雨森林救援隊揭露卡｜A4 二分標籤</title>
    <style>
        @page { size: A4 portrait; margin: 0; }

        @font-face {
            font-family: "Bpmf Rounded";
            src: url("fonts/bopomofo/rounded-medium.woff2") format("woff2");
            font-style: normal;
            font-weight: 500;
            font-display: block;
        }

        @font-face {
            font-family: "Bpmf Rounded";
            src: url("fonts/bopomofo/rounded-bold.woff2") format("woff2");
            font-style: normal;
            font-weight: 800;
            font-display: block;
        }

        :root {
            --font: "Bpmf Rounded", "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            background: #ccc;
            color: #000;
            font-family: var(--font);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page {
            position: relative;
            width: 210mm;
            height: 297mm;
            display: grid;
            grid-template-rows: repeat(2, 148.5mm);
            margin: 8mm auto;
            overflow: hidden;
            background: #fff;
            break-after: page;
            page-break-after: always;
        }

        .page:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .label-cell {
            position: relative;
            display: grid;
            place-items: center;
            width: 210mm;
            height: 148.5mm;
            border-bottom: 0.15mm solid #bbb;
        }

        .card-shell {
            position: relative;
            width: 170mm;
            height: 118.5mm;
            outline: 0.3mm dashed #666;
            outline-offset: 0;
        }

        .reveal-card {
            position: absolute;
            inset: 2mm;
            display: grid;
            grid-template-rows: 13mm 47mm 1fr;
            overflow: hidden;
            border: 0.65mm solid #000;
            border-radius: 4mm;
            background: #fff;
        }

        .dual .reveal-card,
        .briefing .reveal-card {
            grid-template-rows: 13mm 44mm 1fr;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 3mm;
            padding: 1.5mm 4mm;
            border-bottom: 0.45mm solid #000;
        }

        .card-number {
            width: 8mm;
            height: 8mm;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #000;
            color: #fff;
            font-size: 11pt;
            font-weight: 900;
        }

        .card-title {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: 15pt;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 0.06em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-count {
            margin-left: auto;
            font-size: 7.8pt;
            font-weight: 800;
            white-space: nowrap;
        }

        .scene {
            position: relative;
            overflow: hidden;
            border-bottom: 0.45mm solid #000;
            background: #eee;
        }

        .scene img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            filter: grayscale(1) contrast(1.08);
        }

        .stacked-content {
            display: grid;
            grid-template-rows: auto 1fr;
            row-gap: 3mm;
            min-height: 0;
            padding: 5mm 10mm 7mm;
        }

        .reason {
            display: grid;
            place-content: center;
            min-width: 0;
            text-align: center;
        }

        .reason strong {
            margin-bottom: 0.5mm;
            font-size: 9.5pt;
            font-weight: 800;
            line-height: 1.25;
        }

        .reason span {
            font-size: 8.4pt;
            font-weight: 500;
            line-height: 1.35;
        }

        .goal-card {
            display: grid;
            place-content: center;
            gap: 2mm;
            padding: 4mm 8mm;
            border: 0.5mm solid #000;
            border-radius: 3mm;
            background: #f4f4f4;
            text-align: center;
        }

        .goal-card strong {
            font-size: 10pt;
            font-weight: 800;
        }

        .goal-card span {
            font-size: 11.5pt;
            font-weight: 800;
            line-height: 1.45;
        }

        .range {
            display: grid;
            place-items: center;
            width: 56mm;
            height: 13mm;
            place-self: center;
            border: 0.5mm solid #000;
            border-radius: 7mm;
            background: #f4f4f4;
            font-family: "Arial Rounded MT Bold", "PingFang TC", sans-serif;
            font-size: 26pt;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.04em;
        }

        .attributes {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 8mm minmax(0, 1fr);
            min-height: 0;
        }

        .stacked-content > .attributes {
            width: 96mm;
            justify-self: center;
        }

        .attribute {
            display: grid;
            grid-template-rows: 15mm 1fr;
            place-items: center;
            min-width: 0;
            padding-top: 0.5mm;
        }

        .attribute img {
            width: 15mm;
            height: 15mm;
            object-fit: contain;
            filter: grayscale(1) contrast(1.12);
        }

        .attribute-name {
            align-self: start;
            padding-top: 0.3mm;
            font-size: 10pt;
            font-weight: 800;
            line-height: 1.1;
            text-align: center;
            white-space: nowrap;
        }

        .choice-or {
            width: 7mm;
            height: 7mm;
            display: grid;
            place-items: center;
            place-self: center;
            border-radius: 50%;
            background: #000;
            color: #fff;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            font-size: 7.5pt;
            font-weight: 800;
            line-height: 1;
        }

        .dual-content,
        .boss-preview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5mm;
            min-height: 0;
            padding: 6mm 7mm 7mm;
        }

        .job {
            display: grid;
            grid-template-rows: auto 1fr;
            row-gap: 3mm;
            min-width: 0;
            min-height: 0;
            padding: 4mm;
            overflow: hidden;
            border: 0.45mm solid #000;
            border-radius: 2mm;
            background: #f7f7f7;
        }

        .job:nth-child(2) { border-style: dashed; }

        .job-title {
            align-self: center;
            font-size: 10pt;
            font-weight: 800;
            line-height: 1.2;
            text-align: center;
            white-space: nowrap;
        }

        .job-goal {
            display: grid;
            place-items: center;
            margin: 0;
            overflow: hidden;
            font-size: 10.5pt;
            font-weight: 800;
            line-height: 1.45;
            text-align: center;
        }

        .job .range {
            width: 34mm;
            height: 9mm;
            border-width: 0.4mm;
            border-radius: 5mm;
            font-size: 18pt;
        }

        .job .attributes {
            grid-template-columns: minmax(0, 1fr) 5.5mm minmax(0, 1fr);
        }

        .job .attribute {
            grid-template-rows: 11.5mm 1fr;
            padding-top: 0.5mm;
        }

        .job .attribute img {
            width: 11.5mm;
            height: 11.5mm;
        }

        .job .attribute-name {
            padding-top: 0.5mm;
            font-size: 8.2pt;
        }

        .job .choice-or {
            width: 5mm;
            height: 5mm;
            font-size: 6pt;
        }

        .briefing .scene::after {
            content: "沿途完成三次救援，尋找冒險寶物";
            position: absolute;
            right: 3mm;
            bottom: 2mm;
            padding: 1.2mm 2.5mm;
            border: 0.35mm solid #000;
            border-radius: 1.5mm;
            background: rgba(255,255,255,.9);
            font-size: 7.5pt;
            font-weight: 800;
        }

        .sheet-note {
            position: absolute;
            right: 5mm;
            bottom: 2mm;
            left: 5mm;
            color: #777;
            font-size: 6.5pt;
            text-align: center;
        }

        @media print {
            html,
            body { background: #fff; }
            .page { margin: 0; }
            .label-cell { border-color: transparent; }
            .sheet-note { display: none; }
        }
    </style>
</head>
<body>
    <main id="pages"></main>

    <script>
        const cards = [
            {
                number: "0",
                title: "暴雨森林救援隊",
                count: "任務簡報",
                image: "mission-art/storm-forest-rescue/00-mission-briefing.png",
                className: "briefing",
                reasonTitle: "暴雨形成洪水巨獸",
                reason: "牠正朝動物村的避難區前進。",
                goalTitle: "任務目標",
                goal: "沿途完成三次救援、取得寶物，最後合作阻止洪水巨獸。"
            },
            {
                number: "1",
                title: "找出安全道路",
                count: "選 1 隻動物",
                image: "mission-art/storm-forest-rescue/01-flooded-road.png",
                reasonTitle: "積水和倒木擋住路",
                reason: "水還在慢慢上升，隊伍需要一條能安全通過的路。",
                goalTitle: "工作目標",
                goal: "找出安全道路，並留下隊伍看得懂的記號。"
            },
            {
                number: "2",
                title: "搖晃藤橋上的幼獸",
                count: "選 2 隻動物",
                image: "mission-art/storm-forest-rescue/02-vine-bridge.png",
                className: "dual",
                jobs: [
                    { title: "2A｜固定藤橋", goal: "讓藤橋停止劇烈搖晃，不被洪水和漂流木撞斷。" },
                    { title: "2B｜救出小鹿", goal: "靠近小鹿並解開細藤，不能讓橋搖得更厲害。" }
                ]
            },
            {
                number: "3",
                title: "搬運易碎藥品",
                count: "選 1 隻動物",
                image: "mission-art/storm-forest-rescue/03-medicine-crate.png",
                reasonTitle: "玻璃藥瓶不能碰撞或摔破",
                reason: "泥水仍在上升，避難區正等著使用藥品。",
                goalTitle: "工作目標",
                goal: "保護藥瓶，並把全部藥品送過滿是樹根的小路。"
            }
        ];

        function cardMarkup(card) {
            const body = card.jobs ? `
                <div class="${card.className === "briefing" ? "boss-preview" : "dual-content"}">
                    ${card.jobs.map((job) => `<section class="job"><div class="job-title">${job.title}</div><p class="job-goal">${job.goal}</p></section>`).join("")}
                </div>
            ` : `
                <div class="stacked-content">
                    <div class="reason"><strong>${card.reasonTitle}</strong><span>${card.reason}</span></div>
                    <div class="goal-card"><strong>${card.goalTitle}</strong><span>${card.goal}</span></div>
                </div>
            `;
            return `
                <div class="card-shell">
                    <article class="reveal-card">
                        <header class="card-header">
                            <span class="card-number">${card.number}</span>
                            <h2 class="card-title">${card.title}</h2>
                            <span class="player-count">${card.count}</span>
                        </header>
                        <div class="scene"><img src="${card.image}" alt=""></div>
                        ${body}
                    </article>
                </div>
            `;
        }

        const root = document.querySelector("#pages");
        for (let pageIndex = 0; pageIndex < 2; pageIndex += 1) {
            const page = document.createElement("section");
            page.className = "page";
            cards.slice(pageIndex * 2, pageIndex * 2 + 2).forEach((card) => {
                const cell = document.createElement("div");
                cell.className = `label-cell ${card.className || ""}`;
                cell.innerHTML = cardMarkup(card);
                page.appendChild(cell);
            });
            const note = document.createElement("p");
            note.className = "sheet-note";
            note.textContent = `第 ${pageIndex + 1} / 2 張｜A4 二分標籤紙｜裁切 170×118.5mm｜黑白｜100% 實際大小`;
            page.appendChild(note);
            root.appendChild(page);
        }

        document.fonts.ready.then(() => {
            document.documentElement.dataset.ready = "true";
        });
    </script>
</body>
</html>
