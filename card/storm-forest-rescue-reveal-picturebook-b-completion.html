<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暴雨森林救援隊｜B 版補完稿</title>
    <style>
        @page { size: A4 portrait; margin: 0; }

        @font-face {
            font-family: "Bpmf Rounded";
            src: url("fonts/bopomofo/rounded-medium.woff2") format("woff2");
            font-style: normal;
            font-weight: 500;
            font-display: block;
        }

        @font-face {
            font-family: "Bpmf Rounded";
            src: url("fonts/bopomofo/rounded-bold.woff2") format("woff2");
            font-style: normal;
            font-weight: 800;
            font-display: block;
        }

        :root {
            --font: "Bpmf Rounded", "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            background: #ccc;
            color: #000;
            font-family: var(--font);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page {
            position: relative;
            width: 210mm;
            height: 297mm;
            display: grid;
            grid-template-rows: repeat(2, 148.5mm);
            margin: 8mm auto;
            overflow: hidden;
            background: #fff;
        }

        .label-cell {
            position: relative;
            display: grid;
            width: 210mm;
            height: 148.5mm;
            place-items: center;
            border-bottom: 0.15mm solid #bbb;
        }

        .variant-label {
            position: absolute;
            z-index: 2;
            top: 3.5mm;
            left: 8mm;
            padding: 1.3mm 2.6mm;
            border: 0.35mm solid #000;
            border-radius: 1.5mm;
            background: #000;
            color: #fff;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            font-size: 7.5pt;
            font-weight: 700;
            line-height: 1;
        }

        .card-shell {
            position: relative;
            width: 170mm;
            height: 118.5mm;
            outline: 0.3mm dashed #666;
        }

        .reveal-card {
            position: absolute;
            inset: 2mm;
            display: grid;
            grid-template-rows: 13mm 65mm 1fr;
            overflow: hidden;
            border: 0.65mm solid #000;
            border-radius: 4mm;
            background: #fff;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 3mm;
            padding: 1.5mm 4mm;
            border-bottom: 0.45mm solid #000;
        }

        .card-number {
            width: 8mm;
            height: 8mm;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #000;
            color: #fff;
            font-family: "Arial Rounded MT Bold", system-ui, sans-serif;
            font-size: 11pt;
            font-weight: 900;
        }

        .card-title {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: 15pt;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 0.06em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-count {
            margin-left: auto;
            font-size: 7.8pt;
            font-weight: 800;
            white-space: nowrap;
        }

        .scene {
            overflow: hidden;
            border-bottom: 0.45mm solid #000;
            background: #eee;
        }

        .scene img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            filter: grayscale(1) contrast(1.08);
        }

        .picture-book-content {
            display: grid;
            min-height: 0;
            padding: 3.5mm 10mm 5mm;
        }

        .goal-card {
            display: grid;
            place-content: center;
            gap: 1mm;
            padding: 1mm 6mm 0;
            text-align: center;
        }

        .goal-card strong {
            font-size: 9pt;
            font-weight: 800;
        }

        .goal-card span {
            font-size: 12.2pt;
            font-weight: 800;
            line-height: 1.35;
        }

        @media print {
            html,
            body { background: #fff; }
            .page { margin: 0; }
            .label-cell { border-color: transparent; }
        }
    </style>
</head>
<body>
    <main class="page" id="page"></main>

    <script>
        const cards = [
            {
                number: "0",
                title: "暴雨森林救援隊",
                count: "任務簡報",
                image: "mission-art/storm-forest-rescue/00-mission-briefing.png",
                goalTitle: "任務目標",
                goal: "沿途完成三次救援、取得寶物，最後合作阻止洪水巨獸。",
                label: "B｜繪本式｜圖片 65mm｜任務簡報＋Boss 預告"
            },
            {
                number: "3",
                title: "搬運易碎藥品",
                count: "選 1 隻動物",
                image: "mission-art/storm-forest-rescue/03-medicine-crate.png",
                goalTitle: "工作目標",
                goal: "保護藥瓶，並把全部藥品送過滿是樹根的小路。",
                label: "B｜繪本式｜圖片 65mm｜第 3 關"
            }
        ];

        function cardMarkup(card) {
            return `
                <span class="variant-label">${card.label}</span>
                <div class="card-shell">
                    <article class="reveal-card">
                        <header class="card-header">
                            <span class="card-number">${card.number}</span>
                            <h2 class="card-title">${card.title}</h2>
                            <span class="player-count">${card.count}</span>
                        </header>
                        <div class="scene"><img src="${card.image}" alt=""></div>
                        <div class="picture-book-content">
                            <div class="goal-card">
                                <strong>${card.goalTitle}</strong>
                                <span>${card.goal}</span>
                            </div>
                        </div>
                    </article>
                </div>`;
        }

        const page = document.querySelector("#page");
        cards.forEach((card) => {
            const cell = document.createElement("section");
            cell.className = "label-cell";
            cell.innerHTML = cardMarkup(card);
            page.appendChild(cell);
        });

        document.fonts.ready.then(() => {
            document.documentElement.dataset.ready = "true";
        });
    </script>
</body>
</html>
